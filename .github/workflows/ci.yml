name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, template, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      # The offline OCR engine shells out to Tesseract. It is optional: when the package
      # mirrors cannot be reached the job carries on and the two Tesseract tests skip.
      - name: Install Tesseract (best effort)
        continue-on-error: true
        timeout-minutes: 3
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt_get() { sudo -E apt-get -q -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 "$@"; }
          sudo rm -f /var/lib/man-db/auto-update  # skip the slow man page rebuild
          apt_get update
          apt_get install -y --no-install-recommends tesseract-ocr
          tesseract --version
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Validate the SAM template
        run: cfn-lint template.yaml
      - name: Test
        run: pytest --cov --cov-report=term-missing:skip-covered

  frontend:
    name: Frontend (tests, typecheck, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
